<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="sunbeam" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="70%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </radialGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="goldRibbon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
  </defs>

  <!-- Outer Ring with Flames/Rays -->
  <g transform="translate(100, 100)">
    <!-- 24 radiating flame petals -->
    <path d="M 0,-92 C 8,-85 12,-70 0,-62 C -12,-70 -8,-85 0,-92 Z" fill="#dc2626" transform="rotate(0)" />
    <path d="M 0,-92 C 8,-85 12,-70 0,-62 C -12,-70 -8,-85 0,-92 Z" fill="#eab308" transform="rotate(15)" />
    <path d="M 0,-92 C 8,-85 12,-70 0,-62 C -12,-70 -8,-85 0,-92 Z" fill="#dc2626" transform="rotate(30)" />
    <path d="M 0,-92 C 8,-85 12,-70 0,-62 C -12,-70 -8,-85 0,-92 Z" fill="#eab308" transform="rotate(45)" />
    <path d="M 0,-92 C 8,-85 12,-70 0,-62 C -12,-70 -8,-85 0,-92 Z" fill="#dc2626" transform="rotate(60)" />
    <path d="M 0,-92 C 8,-85 12,-70 0,-62 C -12,-70 -8,-85 0,-92 Z" fill="#eab308" transform="rotate(75)" />
    <path d="M 0,-92 C 8,-85 12,-70 0,-62 C -12,-70 -8,-85 0,-92 Z" fill="#dc2626" transform="rotate(90)" />
    <path d="M 0,-92 C 8,-85 12,-70 0,-62 C -12,-70 -8,-85 0,-92 Z" fill="#eab308" transform="rotate(105)" />
    <path d="M 0,-92 C 8,-85 12,-70 0,-62 C -12,-70 -8,-85 0,-92 Z" fill="#dc2626" transform="rotate(120)" />
    <path d="M 0,-92 C 8,-85 12,-70 0,-62 C -12,-70 -8,-85 0,-92 Z" fill="#eab308" transform="rotate(135)" />
    <path d="M 0,-92 C 8,-85 12,-70 0,-62 C -12,-70 -8,-85 0,-92 Z" fill="#dc2626" transform="rotate(150)" />
    <path d="M 0,-92 C 8,-85 12,-70 0,-62 C -12,-70 -8,-85 0,-92 Z" fill="#eab308" transform="rotate(165)" />
    <path d="M 0,-92 C 8,-85 12,-70 0,-62 C -12,-70 -8,-85 0,-92 Z" fill="#dc2626" transform="rotate(180)" />
    <path d="M 0,-92 C 8,-85 12,-70 0,-62 C -12,-70 -8,-85 0,-92 Z" fill="#eab308" transform="rotate(195)" />
    <path d="M 0,-92 C 8,-85 12,-70 0,-62 C -12,-70 -8,-85 0,-92 Z" fill="#dc2626" transform="rotate(210)" />
    <path d="M 0,-92 C 8,-85 12,-70 0,-62 C -12,-70 -8,-85 0,-92 Z" fill="#eab308" transform="rotate(225)" />
    <path d="M 0,-92 C 8,-85 12,-70 0,-62 C -12,-70 -8,-85 0,-92 Z" fill="#dc2626" transform="rotate(240)" />
    <path d="M 0,-92 C 8,-85 12,-70 0,-62 C -12,-70 -8,-85 0,-92 Z" fill="#eab308" transform="rotate(255)" />
    <path d="M 0,-92 C 8,-85 12,-70 0,-62 C -12,-70 -8,-85 0,-92 Z" fill="#dc2626" transform="rotate(270)" />
    <path d="M 0,-92 C 8,-85 12,-70 0,-62 C -12,-70 -8,-85 0,-92 Z" fill="#eab308" transform="rotate(285)" />
    <path d="M 0,-92 C 8,-85 12,-70 0,-62 C -12,-70 -8,-85 0,-92 Z" fill="#dc2626" transform="rotate(300)" />
    <path d="M 0,-92 C 8,-85 12,-70 0,-62 C -12,-70 -8,-85 0,-92 Z" fill="#eab308" transform="rotate(315)" />
    <path d="M 0,-92 C 8,-85 12,-70 0,-62 C -12,-70 -8,-85 0,-92 Z" fill="#dc2626" transform="rotate(330)" />
    <path d="M 0,-92 C 8,-85 12,-70 0,-62 C -12,-70 -8,-85 0,-92 Z" fill="#eab308" transform="rotate(345)" />

    <!-- Outer Laurel Circle -->
    <circle r="65" fill="#f8fafc" stroke="#b45309" stroke-width="4" />
    <circle r="60" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3,2" />

    <!-- Pentagonal Star / Shield Base -->
    <path d="M 0,-45 L 38,-12 L 24,36 L -24,36 L -38,-12 Z" fill="url(#shieldGrad)" stroke="#f59e0b" stroke-width="2.5" />

    <!-- Open Book -->
    <path d="M -22,12 Q -11,6 0,10 Q 11,6 22,12 L 20,24 Q 10,18 0,22 Q -10,18 -20,24 Z" fill="#ffffff" stroke="#94a3b8" stroke-width="1" />
    <line x1="0" y1="10" x2="0" y2="22" stroke="#64748b" stroke-width="1.5" />

    <!-- Cross and Radiance -->
    <path d="M -3,-35 L 3,-35 L 3,-5 L -3,-5 Z" fill="#facc15" />
    <path d="M -15,-23 L 15,-23 L 15,-17 L -15,-17 Z" fill="#facc15" />
    <circle cx="0" cy="-20" r="4" fill="#ffffff" />
  </g>

  <!-- Bottom Ribbon -->
  <path d="M 40,165 Q 100,185 160,165 L 155,178 Q 100,195 45,178 Z" fill="url(#goldRibbon)" stroke="#78350f" stroke-width="1" />
  <text x="100" y="174" font-family="'Times New Roman', serif" font-size="7" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">UKWMS</text>
</svg>
